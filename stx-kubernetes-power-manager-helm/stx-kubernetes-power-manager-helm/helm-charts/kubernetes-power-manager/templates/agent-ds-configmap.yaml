---
apiVersion: v1
kind: ConfigMap
metadata:
  name: power-node-agent-ds
  namespace: intel-power
data:
  power-node-agent-ds.yaml: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: power-node-agent
      namespace: intel-power
    spec:
      selector:
        matchLabels:
          name: power-node-agent-pod
      template:
        metadata:
          namespace: intel-power
          labels:
            name: power-node-agent-pod
        spec:
          serviceAccountName: intel-power-node-agent
{{- with .Values.agent.tolerations }}
          tolerations:
{{ toYaml . | indent 12 }}
{{- end }}
{{- with .Values.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml . | indent 12 }}
{{- end }}
          containers:
            - image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
              imagePullPolicy: IfNotPresent
              securityContext:
                privileged: true
              name: power-node-agent
              args: [ "--zap-log-level","3" ]
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
                requests:
                  cpu: 0
                  memory: 64Mi
              volumeMounts:
                - mountPath: /sys/devices/system/cpu
                  name: cpusetup
                - mountPath: /sys/fs
                  name: cgroup
                  readOnly: true
                - mountPath: /var/lib/kubelet/pod-resources/
                  name: kubesock
                  readOnly: true
          volumes:
            - name: cpusetup
              hostPath:
                path: /sys/devices/system/cpu
            - name: cgroup
              hostPath:
                path: /sys/fs
            - name: kubesock
              hostPath:
                path: /var/lib/kubelet/pod-resources
