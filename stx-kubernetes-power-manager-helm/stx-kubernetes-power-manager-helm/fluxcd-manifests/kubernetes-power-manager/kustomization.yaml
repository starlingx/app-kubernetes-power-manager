---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml

secretGenerator:
  - name: kubernetes-power-manager-system-overrides
    files:
      - kubernetes-power-manager-system-overrides.yaml
  - name: kubernetes-power-manager-static-overrides
    files:
      - kubernetes-power-manager-static-overrides.yaml

generatorOptions:
  disableNameSuffixHash: true
